name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas automatizadas y calidad
    runs-on: ubuntu-latest
    env:
      RUN_DB_INTEGRATION: "1"
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: "3306"
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: root1234
      TEST_MYSQL_DATABASE: restaurantdb

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: restaurantdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            default-libmysqlclient-dev \
            default-mysql-client

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Auditar dependencias
        run: python -m pip_audit -r requirements.txt

      - name: Inicializar base de datos de pruebas
        run: |
          MYSQL_PWD="$TEST_MYSQL_PASSWORD" mysql \
            --protocol=TCP \
            --host="$TEST_MYSQL_HOST" \
            --port="$TEST_MYSQL_PORT" \
            --user="$TEST_MYSQL_USER" \
            < utils/createdb.sql

      - name: Revisar linting
        run: python -m ruff check .

      - name: Verificar formato
        run: python -m ruff format --check .

      - name: Ejecutar pruebas unitarias y de integración
        run: python -m pytest -q
